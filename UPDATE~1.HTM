<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Notes — Myles Keogh</title>
  <meta name="description" content="Field notes from ongoing research into the life of Myles Walter Keogh (1840–1876) — archive visits, newly located sources, and leads in progress.">
  <meta property="og:title" content="Research Notes — Myles Keogh">
  <meta property="og:description" content="Field notes from ongoing research into the life of Myles Walter Keogh.">
  <meta property="og:url" content="https://myleskeogh.net/updates.html">
  <meta name="twitter:card" content="summary">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://myleskeogh.net/updates.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Blog",
    "name": "Research Notes — Myles Keogh",
    "url": "https://myleskeogh.net/updates.html",
    "description": "Field notes from ongoing research into the life of Myles Walter Keogh (1840–1876).",
    "author": { "@type": "Person", "name": "Gareth Cuddy" },
    "about": {
      "@type": "Person",
      "name": "Myles Walter Keogh",
      "sameAs": "https://en.wikipedia.org/wiki/Myles_Keogh"
    }
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:     #f2ede4;
      --ink-2:   #b8b0a0;
      --ink-3:   #7a7265;
      --gold:    #c4973a;
      --gold-2:  #8a6520;
      --bg:      #111110;
      --bg-2:    #1a1917;
      --rule:    rgba(196,151,58,0.25);
      --serif:   Georgia, 'Times New Roman', serif;
      --sans:    -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --mono:    'Courier New', Courier, monospace;
      --card-bg:     #f5efdc;
      --card-rule:   #e8dfc8;
      --card-margin: #c94040;
      --card-text:   #1c1810;
      --card-muted:  #6b5f4a;
      --card-hole:   #ddd4bc;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .site-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2.5rem;
      border-bottom: 1px solid var(--rule);
    }

    .nav-brand {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-2);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-brand:hover { color: var(--gold); }
    .nav-links { display: flex; gap: 2rem; }

    .nav-links a {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-3);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--gold); }
    .nav-links a[aria-current] { color: var(--gold); }

    .page-header {
      max-width: 860px;
      margin: 0 auto;
      padding: 4rem 2rem 3rem;
    }

    .section-label {
      font-family: var(--sans);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
      display: block;
    }

    .page-header h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: normal;
      color: var(--ink);
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    .page-header p { color: var(--ink-2); max-width: 520px; font-size: 1rem; }

    .board {
      max-width: 1060px;
      margin: 0 auto;
      padding: 1rem 2rem 6rem;
    }

    .board-intro {
      font-family: var(--sans);
      font-size: 12px;
      color: var(--ink-3);
      letter-spacing: 0.06em;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--rule);
    }

    .cards {
      column-count: 3;
      column-gap: 1.5rem;
    }

    @media (max-width: 900px) { .cards { column-count: 2; } }
    @media (max-width: 560px) { .cards { column-count: 1; } }

    .card {
      break-inside: avoid;
      background: var(--card-bg);
      margin-bottom: 1.5rem;
      position: relative;
      display: block;
      padding: 2rem 1.25rem 1.4rem 1.6rem;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 27px,
        var(--card-rule) 27px, var(--card-rule) 28px
      );
      background-size: 100% 28px;
      background-position: 0 36px;
      border-left: 3px solid var(--card-margin);
      box-shadow: 0 2px 8px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.2);
    }

    .card.note {
      background-color: #fdf7e3;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 27px,
        #f0e9d0 27px, #f0e9d0 28px
      );
      background-size: 100% 28px;
      background-position: 0 36px;
      border-left-color: #c4973a;
    }

    .card.note .card-tag { color: #8a6520; }

    .card::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--card-hole);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.25);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
      margin-top: 0.25rem;
    }

    .card-tag {
      font-family: var(--sans);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--card-margin);
      line-height: 1;
    }

    .card-date {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--card-muted);
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .card h2 {
      font-family: var(--serif);
      font-size: 14.5px;
      font-weight: bold;
      color: var(--card-text);
      line-height: 1.35;
      margin-bottom: 0.6rem;
    }

    .card p {
      font-family: var(--serif);
      font-size: 13px;
      color: var(--card-muted);
      line-height: 1.6;
      margin: 0 0 0.5rem;
    }

    .card p:last-of-type { margin-bottom: 0; }

    .card blockquote {
      margin: 0.6rem 0 0.5rem;
      padding: 0 0 0 0.6rem;
      border-left: 2px solid var(--card-rule);
      font-style: italic;
      font-size: 12.5px;
      color: var(--card-muted);
      line-height: 1.55;
    }

    .card-footer {
      margin-top: 0.75rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--card-rule);
      font-family: var(--mono);
      font-size: 10px;
      color: var(--card-muted);
      letter-spacing: 0.03em;
    }

    .card-footer a { color: var(--card-muted); }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--sans);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .status::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .status.open    { color: #7a5c2e; }
    .status.found   { color: #3a7a4a; }
    .status.pending { color: #7a5c2e; }

    .loading {
      font-family: var(--sans);
      font-size: 12px;
      color: var(--ink-3);
      letter-spacing: 0.1em;
      padding: 3rem 0;
    }

    footer {
      border-top: 1px solid var(--rule);
      padding: 2.5rem 2rem;
      text-align: center;
    }

    footer p {
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--ink-3);
      margin: 0;
    }

    footer a { color: var(--ink-3); text-decoration: none; }
    footer a:hover { color: var(--gold); }
  </style>
</head>
<body>

  <nav class="site-nav" aria-label="Site navigation">
    <a class="nav-brand" href="/">myleskeogh.net</a>
    <div class="nav-links">
      <a href="/#about-the-project">About</a>
      <a href="/#records">Records</a>
      <a href="/updates.html" aria-current="page">Research notes</a>
      <a href="/#contact">Contact</a>
    </div>
  </nav>

  <header class="page-header">
    <span class="section-label">Field notes</span>
    <h1>Research notes</h1>
    <p>Archive visits, newly located sources, leads in progress. Updated as research develops.</p>
  </header>

  <main class="board">
    <p class="board-intro" id="board-intro">Loading notes&hellip;</p>
    <div class="cards" id="cards-container">
      <p class="loading">Loading&hellip;</p>
    </div>
  </main>

  <footer>
    <p>
      <a href="/">myleskeogh.net</a>
      &nbsp;&middot;&nbsp;
      Research in progress &nbsp;&middot;&nbsp; &copy; Gareth Cuddy
    </p>
  </footer>

  <script>
    function buildCard(note) {
      const isNote = note.style === 'note';
      const cls = isNote ? 'card note' : 'card';

      const bodyHtml = note.body
        .map(p => `<p>${p}</p>`)
        .join('');

      const quoteHtml = note.quote
        ? `<blockquote>${note.quote}</blockquote>`
        : '';

      let footerHtml = '';
      if (note.status || note.footer_text) {
        const statusHtml = note.status
          ? `<span class="status ${note.status}">${note.status_label}</span>`
          : '';
        const textHtml = note.footer_text
          ? note.footer_text
          : '';
        const linkHtml = note.footer_link
          ? ` &nbsp;·&nbsp; <a href="${note.footer_link.url}" target="_blank" rel="noopener">${note.footer_link.label}</a>`
          : '';
        footerHtml = `<div class="card-footer">${statusHtml}${textHtml}${linkHtml}</div>`;
      }

      return `
        <article class="${cls}">
          <div class="card-meta">
            <span class="card-tag">${note.tag}</span>
            <span class="card-date">${note.date}</span>
          </div>
          <h2>${note.title}</h2>
          ${bodyHtml}
          ${quoteHtml}
          ${footerHtml}
        </article>`;
    }

    fetch('notes.json')
      .then(r => r.json())
      .then(notes => {
        const container = document.getElementById('cards-container');
        const intro     = document.getElementById('board-intro');
        container.innerHTML = notes.map(buildCard).join('');
        const n = notes.length;
        intro.textContent = `Most recent first — ${n} note${n !== 1 ? 's' : ''}`;
      })
      .catch(() => {
        document.getElementById('cards-container').innerHTML =
          '<p class="loading">Notes unavailable.</p>';
        document.getElementById('board-intro').textContent = '';
      });
  </script>

</body>
</html>
